name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      # The integration suite needs a real playback endpoint; run it locally.
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: pokeflix-tv-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
